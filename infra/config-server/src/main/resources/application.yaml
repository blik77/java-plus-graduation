server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - classpath:/config-repo/
            - classpath:/config-repo/stats-server/
            - classpath:/config-repo/gateway-server/
            - classpath:/config-repo/event-service/
            - classpath:/config-repo/request-service/
            - classpath:/config-repo/user-service/
            - classpath:/config-repo/compilation-service/
            - classpath:/config-repo/comment-service/
            - classpath:/config-repo/aggregator-service/
            - classpath:/config-repo/analyzer-service/
            - classpath:/config-repo/collector-service/

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true